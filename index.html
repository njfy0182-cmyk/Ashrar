<style>

clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));transition:.2s}

.seg{display:flex;margin-bottom:10px}.seg button{flex:1;background:#17171a;border:1px solid #2b2b2f;color:var(--mut);padding:10px;font:inherit;font-weight:700}.seg button.on{background:var(--r);color:#fff}
.ko{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}.kr{min-width:160px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}.kh{text-align:center;font-size:12px;color:var(--r);font-weight:800}.km{display:flex;flex-direction:column;gap:3px}
.sl{display:flex;align-items:center;background:var(--p);border-inline-start:3px solid #333;padding:4px 8px;font-size:12px;min-height:32px}.sl.w{border-color:var(--y);background:#2a1f08;font-weight:800}.sl.l{opacity:.45;text-decoration:line-through}.sl input{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;outline:0}.sl button{background:none;border:0;color:var(--y);font-size:14px}
.champ{background:linear-gradient(90deg,var(--r2),var(--r));padding:14px;text-align:center;font-family:Lalezar;font-size:24px;margin-bottom:12px}
.adx{background:#101012;border:1px dashed #3a3a3f;padding:12px;margin:12px 0;font-size:13px}.qw{display:flex;gap:6px;align-items:center;margin-top:6px}.qw small{width:64px;color:var(--mut)}.qw button{flex:1;background:#232327;border:1px solid #333;color:var(--bone);padding:8px;font:inherit}.qw button.on{background:var(--y);color:#000;font-weight:800}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{color:var(--r);font-size:11px;padding:6px 2px}.tb td{padding:9px 2px;text-align:center;border-bottom:1px solid #222}.tb td:nth-child(2){text-align:right;font-weight:700}.tb tr:nth-child(2) td{color:var(--y)}
.gm{display:flex;align-items:center;gap:8px;background:var(--p);padding:9px 10px;margin-bottom:6px;font-size:13px}.gm span{flex:1}.gm span:last-child{text-align:left}.gm small{color:var(--mut);width:56px}.rh{font-family:Lalezar;color:var(--r);font-size:18px;margin:12px 0 6px}.si{width:44px;background:#0f0f11;border:1px solid #333;color:#fff;text-align:center;padding:5px}
.guest nav button:not(:nth-child(5)){display:none}.guest .v:not(#v4){display:none!important}
